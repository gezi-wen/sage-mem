# Trusted Publishing（OIDC）—— push 一个 v* tag 就发布，不需要 NPM_TOKEN、不需要 OTP。
#
# 为什么这样做（2026-11-17 决定）：
#   npm 正在收紧「绕过 2FA 的 automation token」（账户变更 2026-08 起、直接发布 2027-01 起），
#   网页创建带 bypass 的 token 已被策略拦；而交互式 `npm publish` 每次都要人按安全密钥。
#   Trusted Publishing 让 npm 直接信任「这个仓库 + 这个 workflow」：CI 现场领一次性凭据，
#   并给包附上 provenance 签名（谁、哪个 commit、哪个 workflow 构建的，可追溯）。
#
# 前置（一次性，已配好）：npmjs.com → 包 sage-mem → Settings → Trusted publishing
#   Publisher: GitHub Actions / Repository: gezi-wen/sage-mem / Workflow: publish.yml
#
# 两种触发：
#   - push `v*` tag：正式发布（tag 必须与 package.json 的 version 完全一致）；
#   - workflow_dispatch + dry_run=true：只跑安装/测试/打包预演，**不发布**。
#
# 注意：
#   - provenance 要求**构建发生在 CI**，本地产的 tgz 只作验证产物，不作为发布来源；
#   - 这里不写 NPM_TOKEN：写一个用不到的 secret，反而是将来 401 的诱因。

name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只预演（npm publish --dry-run），不真正发布'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # OIDC：向 npm 领取一次性发布凭据

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing（OIDC）要求 npm >= 11.5.1；node 20 自带 npm 10，必须先换
      - name: npm 11 for trusted publishing
        run: npm install -g npm@^11 && npm --version

      # 只有 tag 触发才校验版本一致性；手动触发没有 tag 可比
      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "::error::tag $TAG != package.json $PKG"; exit 1; }

      # 与 test.yml 同一套装法（原因写在那边的注释里，两个 workflow 必须一致）：
      # npm 7+ 会自动补装 package.json 里声明、下面没显式列出的 peer，
      # 而 `@deepseek-ai/dsh-skill-filesystem` 整条 peer 链还在 0.0.1-rc.x 那一代，
      # 与这里钉的 0.2.0-rc.1 同槽冲突 → ERESOLVE。安装前临时摘掉它、装完还原。
      # 不要用 --legacy-peer-deps：它连显式列出的 peer 也一起跳过，测试会因模块缺失成片红。
      - name: Install
        run: |
          cp package.json package.json.ci-backup
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));delete p.peerDependencies['@deepseek-ai/dsh-skill-filesystem'];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          npm install --no-save --no-package-lock \
            zod@4.4.3 react@18.3.1 \
            @deepseek-ai/cordis@4.0.4 \
            @deepseek-ai/dsh-typert-protocol@0.2.0-rc.1 \
            @deepseek-ai/dsh-client-locale@0.2.0-rc.1
          mv package.json.ci-backup package.json

      - name: Test
        run: npm test

      - name: Publish (trusted publishing)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            # `--dry-run` 仍会向 registry 查重：版本已发布时直接报
            # "You cannot publish over the previously published versions"。
            # 预演就把版本号临时改成 <ver>-dryrun.<run number>，不提交、不发布。
            node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=p.version+'-dryrun.'+process.env.GITHUB_RUN_NUMBER;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');console.log('dry-run version:',p.version)"
            # 预发布号必须显式给 --tag，否则 npm 拒绝（dry-run 也一样）
            npm publish --dry-run --access public --tag dryrun
          else
            npm publish --provenance --access public
          fi
