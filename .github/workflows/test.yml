name: 测试

# 为什么 CI 在这里不只是「形式」：
# 开发机是 Windows（NTFS 默认**不区分大小写**），而 Linux 是区分大小写的 ——
# 记忆目录的文件名归一、回滚时的同名判定、保留名保护都踩在这条差异上。
# 在 ubuntu-latest 上跑同一批断言，是这套语义唯一能被真验证的地方。
# 时区同理：runner 是 UTC，本地是 +08:00。

# 只挂在 main 上：每笔提交都会**同时推 `feat/autodream` 与 `main` 两个 ref**（内容一致），
# 挂 `push` 全分支等于同一份代码跑两遍 —— 失败时还会发两条通知，白吵人。
# 需要单跑别的分支时用 workflow_dispatch。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 = engines.node 声明的最低版本；20 = 中间 LTS；24 = 当前开发版本。
        # 2026-10-23 审查 COMP-01 的修复：声明了 Node ≥18，就必须真的在 18 上跑。
        node-version: ['18.x', '20.x', '24.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # 断言脚本本身只依赖 node: 内置模块，但 lib/ 会 import 运行期依赖：
      #   - `zod`（dependencies）、`react`（devDependencies）
      #   - 三个 peer：宿主在真实环境里提供，CI 里得自己顶上
      # peer 的 `latest` 标签停在老版本（0.1.x / 0.0.1），所以**钉住具体版本**，
      # 不用 latest；`--no-save --no-package-lock` 保证 CI 不改仓库里的任何文件。
      #
      # ⚠️ 为什么还要先临时摘掉一个 peer（2026-11-05 修）：
      #   npm 7+ 会**自动补装 package.json 里声明、但下面这行没显式列出的 peer**。
      #   2.3.0 起多了 `@deepseek-ai/dsh-skill-filesystem`（随包技能的宿主侧依赖），
      #   它整条 peer 链还在 `0.0.1-rc.x` 那一代（要求 `dsh-typert-protocol@^0.0.1-rc.5`），
      #   而这里钉的是 `0.2.0-rc.1` —— 同一个槽位放不下两代，npm 当场 ERESOLVE，
      #   **测试一条都没跑**。这不是产品问题，是「本地 pnpm、CI npm」两套依赖树的分叉：
      #   pnpm 对 peer 不满足只警告，npm 直接硬失败。
      #   测试本身不需要它（只在字符串层面核对 `cordis.patch.yml` 的 providerName），
      #   所以 install 前临时摘、装完还原 —— 测试读到的 package.json 仍是原版。
      #   账：2026-11-03（v2.3.0）→ 11-05（v2.4.1）连续四个提交 CI 红而没人看。
      #
      # 不要用 `--legacy-peer-deps`：它会把**显式列出的**这几个 peer 也一起跳过，
      # 结果 35 个套件因模块缺失而红（2026-11-05 实测，比原来的错误更难查）。
      - name: 装依赖（peer 用与本机同代的版本顶上）
        run: |
          cp package.json package.json.ci-backup
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));delete p.peerDependencies['@deepseek-ai/dsh-skill-filesystem'];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          npm install --no-save --no-package-lock \
            zod@4.4.3 react@18.3.1 \
            @deepseek-ai/cordis@4.0.4 \
            @deepseek-ai/dsh-typert-protocol@0.2.0-rc.1 \
            @deepseek-ai/dsh-client-locale@0.2.0-rc.1
          mv package.json.ci-backup package.json

      - name: 跑全部断言
        run: npm test

      # 同一批断言再来一遍，显式钉死 UTC：本地是 +08:00，时区敏感的写法会在这里露出来。
      - name: 跑全部断言（TZ=UTC）
        run: npm test
        env:
          TZ: UTC
