name: 测试

# 为什么 CI 在这里不只是「形式」：
# 开发机是 Windows（NTFS 默认**不区分大小写**），而 Linux 是区分大小写的 ——
# 记忆目录的文件名归一、回滚时的同名判定、保留名保护都踩在这条差异上。
# 在 ubuntu-latest 上跑同一批断言，是这套语义唯一能被真验证的地方。
# 时区同理：runner 是 UTC，本地是 +08:00。

# 只挂在 main 上：每笔提交都会**同时推 `feat/autodream` 与 `main` 两个 ref**（内容一致），
# 挂 `push` 全分支等于同一份代码跑两遍 —— 失败时还会发两条通知，白吵人。
# 需要单跑别的分支时用 workflow_dispatch。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # 断言脚本本身只依赖 node: 内置模块，但 lib/ 会 import 运行期依赖：
      #   - `zod`（dependencies）、`react`（devDependencies）
      #   - 三个 peer：宿主在真实环境里提供，CI 里得自己顶上
      # peer 的 `latest` 标签停在老版本（0.1.x / 0.0.1），所以**钉住具体版本**，
      # 不用 latest；`--no-save --no-package-lock` 保证 CI 不改仓库里的任何文件。
      - name: 装依赖（peer 用与本机同代的版本顶上）
        run: |
          npm install --no-save --no-package-lock \
            zod@4.4.3 react@18.3.1 \
            @deepseek-ai/cordis@4.0.4 \
            @deepseek-ai/dsh-typert-protocol@0.2.0-rc.1 \
            @deepseek-ai/dsh-client-locale@0.2.0-rc.1

      - name: 跑全部断言
        run: npm test

      # 同一批断言再来一遍，显式钉死 UTC：本地是 +08:00，时区敏感的写法会在这里露出来。
      - name: 跑全部断言（TZ=UTC）
        run: npm test
        env:
          TZ: UTC
