name: 测试

# 为什么 CI 在这里不只是「形式」：
# 开发机是 Windows（NTFS 默认**不区分大小写**），而 Linux 是区分大小写的 ——
# 记忆目录的文件名归一、回滚时的同名判定、保留名保护都踩在这条差异上。
# 在 ubuntu-latest 上跑同一批断言，是这套语义唯一能被真验证的地方。
# 时区同理：runner 是 UTC，本地是 +08:00。

# 只挂在 main 上：每笔提交都会**同时推 `feat/autodream` 与 `main` 两个 ref**（内容一致），
# 挂 `push` 全分支等于同一份代码跑两遍 —— 失败时还会发两条通知，白吵人。
# 需要单跑别的分支时用 workflow_dispatch。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 = engines.node 声明的最低版本；20 = 中间 LTS；24 = 当前开发版本。
        # 2026-10-23 审查 COMP-01 的修复：声明了 Node ≥18，就必须真的在 18 上跑。
        node-version: ['18.x', '20.x', '24.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # 安装只有一个入口：`scripts/install-dev.mjs`（本地跑的是同一条命令）。
      #
      # 依赖树的权威是仓库里的 `package-lock.json`，不是这里手写的版本号：
      #   - 与宿主共享实例的四个 dsh 包**同时**声明在 `devDependencies`（精确钉版）
      #     与 `peerDependencies`（给宿主看的范围），这是官方要求的两侧镜像写法；
      #   - 以前只写了 peer，npm 只能自己去猜版本，猜到的 `latest` 标签停在旧代
      #     （`0.0.1-rc.x`），与仓库要的那一代撞在同一个槽位上 → ERESOLVE。
      #     声明补对之后冲突消失，**不需要**再临时改 `package.json`。
      #   为什么不写死 npm install 的版本参数：那样每次升宿主都要改两处 YAML，
      #   而漏改的那一处只有 CI 红了才发现；锁 + dev 镜像把这件事收到一个地方。
      #
      # ⚠️ 不要改用 `npm install`：`npm ci` 会核对 `package.json` 与锁是否一致
      #    （不一致直接失败，正是我们要的），并且按锁重建 `node_modules`；
      #   换成 `npm install` 就会按浮动范围重新解析，锁形同虚设。
      - name: 装依赖（npm ci，按仓库里的 lock）
        run: node scripts/install-dev.mjs

      - name: 跑全部断言
        run: npm test

      # 同一批断言再来一遍，显式钉死 UTC：本地是 +08:00，时区敏感的写法会在这里露出来。
      - name: 跑全部断言（TZ=UTC）
        run: npm test
        env:
          TZ: UTC
